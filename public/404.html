<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 - Page Not Found | OM PDF</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        text-align: center;
      }
      .card {
        background: white;
        border-radius: 24px;
        padding: 48px;
        max-width: 500px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.05);
      }
      h1 {
        font-size: 8rem;
        font-weight: 900;
        color: #2684FC;
        margin: 0;
        line-height: 1;
      }
      h2 {
        font-size: 2rem;
        font-weight: 800;
        color: #1e293b;
        margin-top: 16px;
        margin-bottom: 8px;
      }
      p {
        font-size: 1.1rem;
        color: #64748b;
        margin-bottom: 32px;
      }
      a {
        display: inline-flex;
        background: #2684FC;
        color: white;
        padding: 14px 28px;
        font-size: 1rem;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 600;
        transition: background 0.2s;
      }
      a:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>Oops! The page you're looking for doesn't exist, has been moved, or is temporarily unavailable.</p>
      <a href="/">Return to Homepage</a>
    </div>
  </body>
</html>
