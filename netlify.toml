[build]
  publish = "dist"
  command = "npm install && npm run build"

  [build.environment]
    NODE_VERSION = "22.13.0"
    SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_PROJECT_ID"

# Proxy Firebase Auth to avoid third-party cookie issues (First-party Auth)
[[redirects]]
  from   = "/__/auth/*"
  to     = "https://om-pdf.firebaseapp.com/__/auth/:splat"
  status = 200

# SPA routing — all paths serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Basic headers (removed strict COOP/COEP to allow Firebase Auth)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
