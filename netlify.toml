[build]
  publish = "dist"
  command = "npm install && npm run build"

  [build.environment]
    NODE_VERSION = "22.13.0"
    SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_PROJECT_ID"

# SPA routing — all paths serve index.html so React Router works
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Basic headers (removed strict COOP/COEP to allow Firebase Auth)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
