[build]
  publish = "dist"
  command = "npm install && npm run build"

  [build.environment]
    NODE_VERSION = "22.13.0"
    # These values are public but Netlify scanner blocks them because they match env vars.
    SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_AUTH_DOMAIN"

# Redirect all traffic to Cloudflare Pages
[[redirects]]
  from   = "/*"
  to     = "https://om-pdf.pages.dev/:splat"
  status = 301
  force  = true

# Proxy Firebase Auth (Forced to override React Router)
[[redirects]]
  from   = "/__/auth/*"
  to     = "https://om-pdf.firebaseapp.com/__/auth/:splat"
  status = 200
  force  = true

# SPA routing
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Basic headers (RELAXED for Firebase Auth compatibility)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://www.googletagmanager.com https://apis.google.com https://*.firebaseapp.com https://www.gstatic.com https://cdn.jsdelivr.net; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://*.workers.dev https://*.googleapis.com https://*.firebaseio.com https://*.firebase.google.com https://cdn.jsdelivr.net; frame-src 'self' https://*.firebaseapp.com https://*.google.com;"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
